[project]
name = "nbgpu"
version = "0.0.1"
description = "Run local marimo notebooks on remote GPUs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "modal>=1.6",
  "pathspec>=0.12",
]

[project.scripts]
nbgpu = "nbgpu.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
  "marimo==0.25.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbgpu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
  "e2e: starts real marimo processes through the local backend (slower)",
  "modal: creates real Modal sandboxes; skipped unless NBGPU_MODAL_TESTS=1",
]
